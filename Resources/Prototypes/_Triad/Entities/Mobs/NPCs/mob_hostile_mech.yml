- type: entity
  name: Mauler-H
  # suffix: [AI, Mech, Syndicate]
  parent:
  - MobNonHumanHostileBase
  - MobHumanoidHostileAISimpleMelee
  - MobHumanoidHostileAISimpleRanged
  id: MobMechMauler
  description: You really dont want this to get too close to you, really.
  components:
  - type: Loadout
    prototypes:
    - MobHumanoidExplorerGearMechT3
  - type: NpcFactionMember
    factions:
    - SyndicateNF
  - type: Damageable
    damageModifierSet: MobRogueSiliconDamageModifierSet
  - type: Sprite
    drawdepth: Mobs
    sprite: Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: mauler
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mauler
      Critical:
        Base: mauler-broken
      Dead:
        Base: mauler-broken
  - type: Bloodstream
    bloodReagent: WeldingFuel
    bloodMaxVolume: 100
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 1
    baseSprintSpeed : 1
  - type: SlowOnDamage
    speedModifierThresholds:
      250: 0.8
      320: 0.6
  - type: Stamina
    critThreshold: 600
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MobSyndicateNavalOperatorVoid:
            min: 1
            max: 1
          ExGrenadeLaunched:
            min: 1
            max: 1
    - trigger:
        !type:DamageTrigger
        damage: 420
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 20
        Structural: 25
    soundHit:
      collection: MetalThud
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.2
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg
  - type: BasicEntityAmmoProvider
    proto: Bullet9x19mmFMJ
    capacity: 30
    count: 30
  - type: Gun
    showExamineText: false
    minAngle: 4
    maxAngle: 20
    fireRate: 4
    angleIncrease: 2
    angleDecay: 1
    selectedMode: Burst
    availableModes:
      - Burst
    burstCooldown: 1.5
    burstFireRate: 10
    shotsPerBurst: 8
    soundGunshot: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/l6_fire.ogg
  - type: PointLight
    radius: 5
    energy: 2
    color: "#FF3333"