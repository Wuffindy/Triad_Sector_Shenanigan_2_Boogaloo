## Syndicate Naval Medic Projectile
- type: entity
  parent: MobHostileThrowableWeapon
  id: DartSyndicateSaponin
  name: syndicate saponin dart
  description: Blurgh, pricked myself accidentally
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/syringe.rsi
    state: icon
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 2
        reagents:
        - ReagentId: Saponin
          Quantity: 2

