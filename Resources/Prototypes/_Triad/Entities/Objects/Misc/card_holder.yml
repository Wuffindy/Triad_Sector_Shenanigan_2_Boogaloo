- type: entity
  parent: [BaseStorageItem, Clothing, RecyclableItemNoMats]
  id: BaseBusinessCardHolder
  name: card holder
  abstract: true
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: Storage
    storageInsertSound:
        collection: cardSlide
    storageOpenSound:
        collection: cardSlide
    maxItemSize: Tiny
    grid:
    - 0,0,1,5
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
      - Paper
      - Card
    blacklist:
      tags:
      - Book
  - type: UseDelay # Mono
    delay: 0.1
  - type: Clothing
    slots: [wallet]
    quickEquip: false
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      closed-paper:
        whitelist:
          components:
          - Paper
          - Card
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        closeLayer:
          Open: { visible: false }
          Closed: { visible: true }
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }
        closed-paper:
          Open: { state: open-paper }
          Closed: { state: closed-paper }
  - type: StaticPrice
    price: 0.01

- type: entity
  parent: BaseBusinessCardHolder
  id: CardHolder
  name: card holder
  components:
  - type: Sprite
    sprite: _Triad/Objects/Misc/card_holder.rsi
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
      visible: false
    - state: closed-paper
      map: ["closed-paper"]
      visible: false

- type: entity
  parent: CardHolder
  id: CardHolderFilledWhite
  name: business card pack (white) 
  suffix: Filled, white
  components:
  - type: OpenTriggeredStorageFill
    contents:
    - id: BusinessCardWhite
      amount: 12

- type: entity
  parent: CardHolder
  id: CardHolderFilledBlack
  name: business card pack (black)
  suffix: Filled, Black
  components:
  - type: OpenTriggeredStorageFill
    contents:
    - id: BusinessCardBlack
      amount: 12