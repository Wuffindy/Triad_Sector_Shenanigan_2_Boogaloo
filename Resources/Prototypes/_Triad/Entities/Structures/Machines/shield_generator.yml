# Remember to clean the circuit board later
- type: entity
  id: ShieldGeneratorSmallCiv
  parent: ShieldGeneratorBase
  name: MS-50 "Knight" Shield Generator
  description: a lightweight civilian shield, reliable at for preventing major crashes around high traffic area
  components:
  - type: ShipShieldEmitter
    damageLimit: 2000
    healPerSecond: 100
    damageExp: 1.05 # Mono uses all of this on all, so idk, following them
    baseDraw: 5000
    maxDraw: 5000
    unpoweredBonus: 2
    damageOverloadTimePunishment: 45
    shieldColor: "#24FF61"
    collisionResistanceMultiplier: 0.2
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/shield.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#24FF61"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
          - 194 # oxygen
          - 0 # nitrogen
          - 0 # carbon dioxide
          - 6 # plasma
          temperature: 752.48
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Explosive
    explosionType: Default
    maxIntensity: 4000
    intensitySlope: 4
    totalIntensity: 300
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#24FF61"
  - type: Machine
    board: MachineShieldMS100Circuitboard # TO CHANGE
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: PirateBountyItem
    id: ShipShield
  - type: ShipRepairable
    repairTime: 20
    repairCost: 100

